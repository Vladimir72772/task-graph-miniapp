<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Граф задач</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#14151c;--bg2:#1b1d27;--bg3:#232634;--line:#2e3243;--tx:#e6e9f2;--mut:#8b93a7;--acc:#a78bfa;--green:#3ecf8e;--red:#ef6a6a;--org:#fb923c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
/* колесо типов */
.wheel{display:flex;gap:8px;padding:10px 12px 8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:none}
.wheel::-webkit-scrollbar{display:none}
.wheel button{flex:1 0 auto;scroll-snap-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:9px 14px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-width:78px}
.wheel button i{font-style:normal;font-size:20px}
.wheel button.on{background:var(--acc);border-color:var(--acc);color:#14151c;font-weight:700}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 12px 96px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:15px;color:var(--tx);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#14151c;font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.sm{padding:6px 11px;font-size:14px}
.now{background:linear-gradient(135deg,#2a2350,#1b1d27);border:1px solid #4a3f7a;border-radius:14px;padding:12px}
.now b{font-size:19px;display:block}.now .mut{font-size:13px}
.now .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#14151c;font-weight:700}
.btn.red{color:var(--red)}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--bg3);color:var(--tx);font-weight:600}
.amount{font-size:44px;font-weight:700;text-align:center;padding:6px 0 0;font-variant-numeric:tabular-nums}
.amount small{font-size:22px;color:var(--mut)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pad button{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 0;font-size:21px}
.pad button:active,.chip:active,.btn:active{filter:brightness(1.3)}
.send{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:6px}
.send button{width:100%;background:var(--acc);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;color:#14151c}
.send button:disabled{opacity:.4}
.status{font-size:12px;color:var(--mut);text-align:center;display:flex;justify-content:center;gap:10px}
.status a{color:var(--acc)}
.toast{position:fixed;left:12px;right:12px;top:10px;background:#1f2a22;border:1px solid var(--green);border-radius:12px;padding:10px 12px;font-size:14px;z-index:9;display:none}
.toast.err{background:#2c1c1c;border-color:var(--red)}
.conf{background:#fb923c1f;border:1px solid #fb923c88;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:8}
.sheet>div{background:var(--bg2);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));width:100%;display:flex;flex-direction:column;gap:10px;max-height:88%;overflow:auto}
.hist{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wheel" id="wheel"></div>
<div class="pages" id="pages">
  <div class="page" id="p-act"></div>
  <div class="page" id="p-fin"></div>
  <div class="page" id="p-rem"></div>
  <div class="page" id="p-task"></div>
  <div class="page" id="p-view"></div>
</div>
<div class="send"><button id="send">Записать</button><div class="status" id="status"></div></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
'use strict';
/* Мини-приложение «Граф задач». Записи складываются в очередь на телефоне и уходят в закрытый репозиторий GitHub
   (папка inbox, по файлу на запись). Программа на компьютере забирает их и удаляет. Без настроенного репозитория
   запись можно отправить текстом в чат. */
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const $ = (id) => document.getElementById(id);
const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const p2 = (n) => String(n).padStart(2, '0');
const hm = (d) => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
const dkey = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return dkey(d); };
const dm = (k) => `${k.slice(8, 10)}.${k.slice(5, 7)}`;
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* */ } } };
const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch { /* */ } };

const DEFAULT_STATE = {
  categories: [['study', 'Учёба', '#4c9aff'], ['work', 'Работа', '#38bdf8'], ['sport', 'Спорт', '#3ecf8e'], ['food', 'Еда', '#fb923c'], ['chores', 'Быт', '#a3a3a3'], ['commute', 'Дорога', '#facc15'], ['rest', 'Отдых', '#c084fc'], ['social', 'Соцсети', '#f472b6'], ['sleep', 'Сон', '#6366f1']].map(([id, label, color]) => ({ id, label, color })),
  finCategories: [['food', 'Еда', '#fb923c'], ['transport', 'Транспорт', '#facc15'], ['home', 'Дом', '#a3a3a3'], ['fun', 'Развлечения', '#f472b6'], ['study', 'Учёба', '#4c9aff'], ['health', 'Здоровье', '#3ecf8e'], ['other', 'Другое', '#94a3b8']].map(([id, label, color]) => ({ id, label, color })),
  tags: [], projects: [], current: null, paused: null, conflicts: [], updatedAt: null,
};
let state = { ...DEFAULT_STATE, ...ls.get('tgm-state', {}) };
let cfg = ls.get('tgm-cfg', { repo: '', token: '' });
let queue = ls.get('tgm-queue', []);
let hist = ls.get('tgm-hist', []);
const TYPES = [['act', '⏱', 'Действие'], ['fin', '💰', 'Финансы'], ['rem', '⏰', 'Напоминание'], ['task', '📌', 'Задача'], ['view', '📊', 'Обзор']];
let tab = 'act';
let full = ls.get('tgm-data', null); let viewTab = 'day';
const now = () => new Date();
const F = {
  act: { category: null, newCat: '', mode: 'now', from: '', to: '', timer: 0, note: '' },
  fin: { amount: '', category: null, newCat: '', note: '' },
  rem: { text: '', date: dkey(now()), time: '' },
  task: { title: '', mode: 'none', date: dkey(now()), time: '', from: '', to: '', tags: [], newTag: '', project: null, estimate: 0, list: true },
};

/* ---------- хранилище настроек: облако Telegram, иначе память телефона ---------- */
function cloudGet(key) { return new Promise((res) => { try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) return tg.CloudStorage.getItem(key, (e, v) => res(e ? null : v || null)); } catch { /* */ } res(null); }); }
function cloudSet(key, v) { try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem(key, v); } catch { /* */ } }

/* ---------- GitHub ---------- */
const gh = async (path, opt = {}) => {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`, { ...opt, headers: { Authorization: `Bearer ${cfg.token}`, Accept: opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
  if (!r.ok && r.status !== 404 && r.status !== 422) throw new Error(r.status === 401 ? 'GitHub не принял токен' : r.status === 403 ? 'у токена нет доступа к репозиторию' : `GitHub ответил ${r.status}`);
  return r;
};
const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const configured = () => /^[\w.-]+\/[\w.-]+$/.test(cfg.repo) && cfg.token.length > 10;
let flushing = false;
async function flush() {
  if (flushing || !configured() || !queue.length) return render.status();
  flushing = true; render.status();
  try {
    while (queue.length) {
      const ev = queue[0];
      const path = `inbox/${ev.id}.json`;
      let r = await gh(path, { method: 'PUT', body: JSON.stringify({ message: 'запись из мини-приложения', content: b64(JSON.stringify(ev)) }) });
      if (r.status === 404) throw new Error('репозиторий не найден');
      // 422 бывает, когда запись уже дошла, а ответ GitHub потерялся в сети: при повторе файл уже есть.
      if (r.status === 422) { const chk = await gh(path, { cache: 'no-store' }); if (chk.status !== 200) throw new Error('GitHub отклонил запись (422)'); }
      queue.shift(); ls.set('tgm-queue', queue);
    }
    lastErr = '';
  } catch (e) { lastErr = String(e.message || e); }
  flushing = false; render.status();
}
let lastErr = '';
async function pullData() {
  try { const r = await gh('data.json', { raw: true, cache: 'no-store' }); if (r.status === 404) return; full = await r.json(); ls.set('tgm-data', full); render.view(); } catch (e) { lastErr = String(e.message || e); render.status(); }
}
async function pull() {
  pullData();
  if (!configured()) return;
  try { const r = await gh('state.json', { raw: true, cache: 'no-store' }); if (r.status === 404) return; const s = await r.json();
    // Сводка с компьютера старше того, что вы сами записали с телефона (компьютер выключен или ещё не забрал записи): своё не затираем.
    const mine = state.localAt && (!s.updatedAt || s.updatedAt < state.localAt) ? { current: state.current, paused: state.paused, localAt: state.localAt } : {};
    state = { ...DEFAULT_STATE, ...s, ...mine }; ls.set('tgm-state', state); renderAll(); } catch (e) { lastErr = String(e.message || e); render.status(); }
}

/* ---------- запись ---------- */
const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
function push(ev, label) {
  const e = { id: uid(), ts: now().toISOString(), v: 1, ...ev };
  queue.push(e); ls.set('tgm-queue', queue);
  hist.unshift({ ts: e.ts, label }); hist = hist.slice(0, 12); ls.set('tgm-hist', hist);
  haptic('medium'); toast('✓ ' + label);
  if (!configured()) offerText(e); else flush();
  renderAll();
}
/** Та же запись словами, как её понимает бот: запасной путь через чат. */
function asText(e) {
  const t = (x) => (x || '').replace(':', '.');
  if (e.kind === 'activity') {
    const c = e.label; const n = e.note ? ' ' + e.note : '';
    if (e.mode === 'stop') return 'стоп'; if (e.mode === 'pause') return 'пауза'; if (e.mode === 'resume') return 'продолжить';
    if (e.mode === 'extend') return `ещё ${e.timerMin}`;
    if (e.mode === 'range') return `${c}${n} ${e.from}-${e.to}`;
    if (e.mode === 'since') return `${c}${n} с ${t(e.from)}${e.timerMin ? `, ещё ${e.timerMin} минут` : ''}`;
    return `${c}${n} начал${e.timerMin ? ` ${e.timerMin} минут` : ''}`;
  }
  if (e.kind === 'expense') return `ф ${e.amount} ${[e.categoryLabel, e.note].filter(Boolean).join(' ')}`.trim();
  if (e.kind === 'reminder') return `н ${e.text} д ${dm(e.date)} в ${t(e.time)}`;
  if (e.kind === 'task') return `з ${e.title}${e.date ? ` к д ${dm(e.date)}` : ''}${e.time ? ` в${t(e.time)}` : ''}`;
  return '';
}
function offerText(e) {
  const text = asText(e); if (!text) return;
  sheet([h('b', {}, 'Репозиторий не подключён'), h('div', { class: 'mut' }, 'Запись сохранена на телефоне и уйдёт, когда вы подключите репозиторий в настройках. Сейчас её можно отправить текстом в чат с ботом:'),
    h('input', { value: text, readonly: true, id: 'txt' }),
    h('div', { class: 'row' }, h('button', { class: 'btn pri', onclick: () => { const url = 'https://t.me/share/url?url=' + encodeURIComponent(text); if (tg) tg.openTelegramLink(url); else window.open(url); } }, 'Отправить в чат'),
      h('button', { class: 'btn', onclick: () => { queue = queue.filter((x) => x.id !== e.id); ls.set('tgm-queue', queue); closeSheet(); renderAll(); } }, 'Убрать из очереди'), h('button', { class: 'btn', onclick: closeSheet }, 'Оставить'))]);
}

/* ---------- интерфейс ---------- */
function toast(t, err) { const e = $('toast'); e.textContent = t; e.className = 'toast' + (err ? ' err' : ''); e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, 2200); }
function sheet(kids) { const b = $('sheetBody'); b.replaceChildren(...kids.flat().filter(Boolean)); $('sheet').style.display = 'flex'; }
function closeSheet() { $('sheet').style.display = 'none'; }
$('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
const chip = (label, on, onclick, extra) => h('button', { class: 'chip' + (on ? ' on' : '') + (extra && extra.sm ? ' sm' : ''), onclick: () => { haptic(); onclick(); } }, extra && extra.color ? h('span', { class: 'dot', style: `background:${extra.color}` }) : null, label);
const timeChips = (cur, set, list) => h('div', { class: 'chips' }, list.map(([l, v]) => chip(l, cur === v, () => set(v), { sm: true })));
const ago = (min) => hm(new Date(Date.now() - min * 60000));
const ahead = (min) => hm(new Date(Date.now() + min * 60000));
const keep = (id) => { const a = document.activeElement; return a && a.id === id ? [a.selectionStart, a.selectionEnd] : null; };
const refocus = (id, sel) => { if (!sel) return; const e = $(id); if (e) { e.focus(); try { e.setSelectionRange(sel[0], sel[1]); } catch { /* */ } } };

const render = {
  wheel() { $('wheel').replaceChildren(...TYPES.map(([id, ic, label]) => h('button', { class: tab === id ? 'on' : '', 'data-tab': id, onclick: () => go(id) }, h('i', {}, ic), label))); },
  status() {
    const s = $('status'); const parts = [];
    if (!configured()) parts.push('репозиторий не подключён'); else if (flushing) parts.push('отправляю…'); else if (lastErr) parts.push('⚠ ' + lastErr); else parts.push(queue.length ? `в очереди: ${queue.length}` : 'всё отправлено');
    if (configured() && queue.length && !flushing) parts.push(`в очереди: ${queue.length}`);
    s.replaceChildren(h('span', {}, [...new Set(parts)].join(' · ')), h('a', { onclick: settings, id: 'cfgLink' }, 'настройки'));
  },
  act() {
    const f = F.act; const cur = state.current; const kids = [];
    for (const c of state.conflicts || []) kids.push(h('div', { class: 'conf' }, h('b', {}, 'Записи расходятся'), h('div', {}, c.text || `На ${c.when || 'одно время'} в телефоне и на компьютере разные записи. Какую оставить?`),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => resolve(c, 'phone') }, '📱 ' + (c.phone || 'из телефона')), h('button', { class: 'btn', onclick: () => resolve(c, 'pc') }, '💻 ' + (c.pc || 'с компьютера')))));
    if (cur) kids.push(h('div', { class: 'now' }, h('span', { class: 'mut' }, `${state.localAt && (!state.updatedAt || state.updatedAt < state.localAt) ? 'Записано с телефона' : 'Сейчас'} · с ${hm(new Date(cur.start))}${cur.until ? ` · до ${hm(new Date(cur.until))}` : ''}`), h('b', {}, `${cur.label} — ${dur((Date.now() - Date.parse(cur.start)) / 60000)}`),
      h('div', { class: 'acts' }, h('button', { class: 'btn pri', onclick: () => quick('stop', 'Закончил: ' + cur.label) }, '■ Закончить'), h('button', { class: 'btn', onclick: () => quick('pause', 'Пауза: ' + cur.label) }, '⏸ Пауза'),
        [10, 30].map((m) => h('button', { class: 'btn', onclick: () => push({ kind: 'activity', mode: 'extend', timerMin: m, category: cur.category, label: cur.label }, `${cur.label}: ещё ${m} мин`) }, `ещё ${m} мин`)))));
    else if (state.paused) kids.push(h('div', { class: 'now' }, h('span', { class: 'mut' }, 'На паузе'), h('b', {}, '⏸ ' + state.paused.label), h('div', { class: 'acts' }, h('button', { class: 'btn pri', onclick: () => quick('resume', 'Продолжил: ' + state.paused.label) }, '▶ Продолжить'))));
    else kids.push(h('div', { class: 'now' }, h('span', { class: 'mut' }, state.updatedAt ? `По данным компьютера на ${hm(new Date(state.updatedAt))}` : 'Данных с компьютера пока нет'), h('b', {}, 'Чем занимаетесь?')));
    kids.push(h('div', { class: 'sec' }, 'Что'), h('div', { class: 'chips' }, state.categories.map((c) => chip(c.label, f.category === c.id, () => { f.category = c.id; f.newCat = ''; render.act(); sync(); }, { color: c.color }))),
      h('input', { id: 'newCat', placeholder: 'или новая категория', value: f.newCat, oninput: (e) => { f.newCat = e.target.value; if (f.newCat) f.category = null; sync(); } }));
    kids.push(h('div', { class: 'sec' }, 'Когда'), h('div', { class: 'seg' }, [['now', 'Сейчас начал'], ['since', 'Уже идёт с…'], ['range', 'Было с… по…']].map(([m, l]) => h('button', { class: f.mode === m ? 'on' : '', onclick: () => { f.mode = m; if (m !== 'now' && !f.from) f.from = ago(30); if (m === 'range' && !f.to) f.to = hm(now()); render.act(); sync(); } }, l))));
    if (f.mode !== 'now') kids.push(h('div', { class: 'row' }, h('label', {}, 'С', h('input', { type: 'time', id: 'aFrom', value: f.from, oninput: (e) => { f.from = e.target.value; sync(); } })), f.mode === 'range' ? h('label', {}, 'По', h('input', { type: 'time', id: 'aTo', value: f.to, oninput: (e) => { f.to = e.target.value; sync(); } })) : null),
      timeChips(f.from, (v) => { f.from = v; render.act(); sync(); }, [[5, '5 мин назад'], [15, '15 мин'], [30, '30 мин'], [60, 'час'], [120, '2 часа']].map(([m, l]) => [l, ago(m)])),
      f.mode === 'range' ? timeChips(f.to, (v) => { f.to = v; render.act(); sync(); }, [['закончил сейчас', hm(now())], ['5 мин назад', ago(5)], ['15 мин назад', ago(15)]]) : null);
    if (f.mode !== 'range') kids.push(h('div', { class: 'sec' }, f.mode === 'now' ? 'Таймер: сколько буду заниматься' : 'Таймер: сколько ещё'), h('div', { class: 'chips' }, [[0, 'без таймера'], [10, '10 мин'], [15, '15'], [25, '25'], [30, '30'], [45, '45'], [60, '1 ч'], [90, '1,5 ч']].map(([m, l]) => chip(l, f.timer === m, () => { f.timer = m; render.act(); sync(); }, { sm: true }))));

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); pull(); } });
  window.addEventListener('online', flush);
})();
</script>
